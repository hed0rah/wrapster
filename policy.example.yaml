# wrapster policy configuration
#
# Two modes per SSH host:
#   allowlist (default) -- deny by default; only commands matching an
#     allowed_commands rule run. A real boundary.
#   trusted: true       -- full shell (pipes, $(), one-liners) via guardrail,
#     gated only by the always-on hard-deny net + filters. This is shell access;
#     secure the remote account. See the dev-box example below and
#     docs/security-model.md.
#
# Hard-deny safety rules (recursive rm of system paths, dd to devices, reverse
# shells, fork bombs, etc.) are ALWAYS blocked, in both modes. Unknown policy
# keys are a hard error (strict parsing), so a config never silently means less
# than it says.

defaults:
  # SSH connection defaults (overridable per-host)
  port: 22
  # user: deploy
  # identity_file: ~/.ssh/id_ed25519

  # Execution limits
  timeout: 30s
  max_output_bytes: 1048576  # 1 MiB

  # Shell injection protection: when false (default), commands containing
  # ; | & ` $() {} are rejected. Set true only if you need pipes/chaining
  # and trust the command patterns in your allowlist.
  allow_shell_operators: false

  # Default allowed commands, available on ALL hosts.
  allowed_commands:
    - command: uptime
      description: "System uptime"

    - command: hostname
      description: "Show hostname"

    - command: whoami
      description: "Current user"

    - command: df
      args_pattern: "-[hTi]+( /[a-zA-Z0-9/_-]*)?"
      description: "Disk usage (safe flags only)"

    - command: free
      args_pattern: "-[mghb]?"
      description: "Memory usage"

    - command: uname
      args_pattern: "-[asnrvmpio]*"
      description: "System info"

    - command: date
      description: "Current date/time"

    - command: ps
      args_pattern: "(aux|ef|--no-headers.*)"
      description: "Process list (read-only)"

    - command: systemctl
      args_pattern: "status .+"
      description: "Service status (read-only)"

    - command: journalctl
      args_pattern: "--no-pager (-u .+|--since .+|-n \\d+).*"
      description: "Journal logs (read-only)"

    - command: docker
      args_pattern: "(ps|stats|logs|inspect) .*"
      description: "Docker read-only commands"

    - command: kubectl
      args_pattern: "(get|describe|logs|top) .*"
      description: "Kubernetes read-only commands"

  # Patterns always denied (applied before allowlist).
  denied_patterns:
    - "sudo"
    - "\\brm\\b"
    - "\\bmv\\b"
    - ">>"       # append redirect
    - ">"        # write redirect

# Per-host overrides, merged with defaults.
hosts:
  prod-web:
    description: "Production web server"  # label shown in the hosts:// inventory resource
    user: deploy
    identity_file: ~/.ssh/prod_ed25519
    ssh_options:
      ProxyJump: bastion.example.com
    allowed_commands:
      - command: nginx
        args_pattern: "-t|-T|-s reload"
        description: "Nginx config test or reload"

      - command: tail
        args_pattern: "-n \\d+ /var/log/nginx/(access|error)\\.log"
        description: "Read nginx logs (last N lines)"

  prod-db:
    user: dbadmin
    port: 2222
    timeout: 60s
    allowed_commands:
      - command: psql
        args_pattern: "-c ['\"]SELECT .+['\"]"
        description: "PostgreSQL SELECT queries only"

      - command: pg_isready
        description: "PostgreSQL health check"

    denied_patterns:
      - "DROP"
      - "DELETE"
      - "TRUNCATE"
      - "ALTER"
      - "INSERT"
      - "UPDATE"

  staging:
    user: deploy
    # More permissive on staging, allow shell operators for pipes.
    allow_shell_operators: true
    allowed_commands:
      - command: tail
        args_pattern: ".*"
        description: "Tail any file"

      - pattern: "cat /var/log/.+"
        description: "Read log files"

      - command: grep
        args_pattern: ".*"
        description: "Search files"

  # A host you fully control and want full shell access on. trusted: true skips
  # the allowlist (full pipes/substitution) but keeps the hard-deny net + filters.
  # Only safe when the remote account itself is constrained (non-root, egress).
  dev-box:
    user: dev
    identity_file: ~/.ssh/id_ed25519
    trusted: true
    environment:
      PATH: /opt/tools/bin:$PATH   # $VAR extension is allowed; $(...) is not
